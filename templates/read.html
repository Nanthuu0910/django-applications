<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Management</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family:italic
        }

        body {
            min-height: 100vh;
            background: #f4f6fb;
            padding: 40px 20px;
        }

        .container {
            max-width: 1100px;
            margin: auto;
        }

        
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }


        .add-btn {
            text-decoration: none;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            padding: 12px 20px;
            border-radius: 8px;
            font-weight: bold;
            transition: 0.3s;
           
        }

        .add-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(102, 126, 234, 0.4);
        }


        .table-card {
            background: white;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
        }

       

        .table-header h2 {
            color: #333;
            font-size: 20px;
        }

        .table-wrapper {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th {
            background: #f8f9fc;
            color: #555;
            padding: 16px;
            text-align: left;
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        td {
            padding: 16px;
            border-top: 1px solid #eee;
            color: #444;
            font-size: 15px;
        }

        tr {
            transition: 0.2s;
        }

        tbody tr:hover {
            background: #f8f9ff;
        }

        
        .student-name {
            font-weight: bold;
            color: #333;
        }

    
        .blood {
            display: inline-block;
            padding: 5px 10px;
            border-radius: 20px;
            background: #ffe8e8;
            color: #d63031;
            font-size: 13px;
            font-weight: bold;
        }

    
        .actions {
            display: flex;
            gap: 8px;
        }

        .edit-btn,
        .delete-btn {
            text-decoration: none;
            padding: 7px 12px;
            border-radius: 6px;
            font-size: 13px;
            font-weight: bold;
        }

        .edit-btn {
            background: #e8f0ff;
            color: #4169e1;
        }

        .edit-btn:hover {
            background: #4169e1;
            color: white;
        }

        .delete-btn {
            background: #ffe8e8;
            color: #e74c3c;
        }

        .delete-btn:hover {
            background: #e74c3c;
            color: white;
        }

    
        .empty {
            text-align: center;
            padding: 40px;
            color: #888;
        }

        @media (max-width: 700px) {

            body {
                padding: 25px 10px;
            }

            .header {
                flex-direction: column;
                align-items: flex-start;
                gap: 15px;
            }

            .header h1 {
                font-size: 25px;
            }

            .add-btn {
                width: 100%;
                text-align: center;
            }

            th,
            td {
                padding: 12px;
                white-space: nowrap;
            }
        }
    </style>
</head>

<body>

<div class="container">

    
    <div class="header">

        <div>
            <h1>Student Management</h1>
        
        </div>

        <a href="{% url 'create' %}" class="add-btn">
            + Add Student
        </a>

    </div>


  
    <div class="table-card">

       
        <div class="table-wrapper">

            <table>

                <thead>
                    <tr>
                        <th>Name</th>
                        <th>Age</th>
                        <th>Email</th>
                        <th>Blood Group</th>
                        <th>Actions</th>
                    </tr>
                </thead>

                <tbody>

                    {% for s in student %}

                    <tr>

                        <td>
                            <span class="student-name">
                                {{ s.name }}
                            </span>
                        </td>

                        <td>
                            {{ s.age }}
                        </td>

                        <td>
                            {{ s.email }}
                        </td>

                        <td>
                            <span class="blood">
                                {{ s.blood }}
                            </span>
                        </td>

                        <td>
                            <div class="actions">

                                <a href="{% url 'update' s.id %}"
                                   class="edit-btn">
                                    Edit
                                </a>

                                <a href="{% url 'delete' s.id %}"
                                   class="delete-btn">
                                    Delete
                                </a>

                            </div>
                        </td>

                    </tr>

                    {% empty %}

                    <tr>
                        <td colspan="5" class="empty">
                            No students found.
                        </td>
                    </tr>

                    {% endfor %}

                </tbody>

            </table>

        </div>

    </div>

</div>

</body>
</html>
